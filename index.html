<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Challenge</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MathGame">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="game">
    <div class="stats">
      <span>Счёт: <b id="score">0</b></span>
      <span>Время: <b id="timer">60</b>с</span>
    </div>

    <div class="mode-switch">
      <button data-mode="arithmetic" class="active">Арифметика</button>
      <button data-mode="physics">Формулы</button>
    </div>

    <div id="question" class="question">7 × 8 = ?</div>
    <div id="points-badge" class="points-badge"></div>

    <div id="answers" class="answers"></div>

    <div id="feedback" class="feedback"></div>
  </div>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW зарегистрирован', reg))
        .catch(err => console.error('SW ошибка', err));
    });
  }
</script>
  <script src="script.js"></script>
</body>
</html>
