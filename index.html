      <div class="stats">
        <div class="stat-item">
          <span class="stat-label">Счёт</span>
          <span class="stat-value" id="score">0</span>
        </div>

        <div class="stat-item" id="timerContainer">
          <span class="stat-label">Время</span>
          <span class="stat-value" id="timer">60</span>
        </div>

        <div class="stat-item hidden" id="livesContainer">
          <span class="stat-label">Жизни</span>
          <span class="stat-value" id="lives" style="color:var(--error);">❤️❤️❤️</span>
        </div>

        <!-- Блок комбо вынесен отдельно и включается динамически -->
        <div class="combo-container hidden" id="comboBadge">
          <span class="stat-label">Комбо</span>
          <span class="stat-value">×1</span>
        </div>
      </div>
